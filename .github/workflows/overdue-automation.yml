name: Overdue corrective-action automation

on:
  schedule:
    # 09:00 UAE (UTC+4)
    - cron: "0 5 * * *"
  workflow_dispatch: {}

concurrency:
  group: overdue-corrective-action-automation
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      OVERDUE_AUTOMATION_ENABLED: ${{ vars.OVERDUE_AUTOMATION_ENABLED }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Validate production configuration
        run: |
          test -n "$DATABASE_URL" || { echo "DATABASE_URL secret is missing"; exit 1; }
          test "$OVERDUE_AUTOMATION_ENABLED" = "true" || { echo "Automation remains in safe preview mode"; exit 1; }
      - run: python run_overdue_automation.py
